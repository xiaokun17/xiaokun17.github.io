name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: false

    - name: Upgrade Bundler
      run: gem install bundler -v 4.0.20

    - name: Install deps
      run: |
        npm install -g mermaid.cli
        bundle install

    - name: Build and deploy website
      env:
        SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        git config user.name "GitHub Action"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        options=(--src "$SOURCE_BRANCH" --deploy gh-pages)
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          options+=(--no-push)
        fi
        bash bin/deploy "${options[@]}" <<< y

    - name: Request a Pages build from the published branch
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        publish_branch=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source.branch')
        if [[ "$publish_branch" == gh-pages ]]; then
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
        fi
