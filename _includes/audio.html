<figure>
  <audio src="{{ include.path | relative_url | escape }}"
    {% if include.class %}class="{{ include.class | escape }}"{% endif %}
    {% if include.title or include.alt %}aria-label="{{ include.title | default: include.alt | escape }}"{% endif %}
    {% if include.autoplay %}autoplay{% endif %}
    {% if include.controls %}controls{% endif %}
    {% if include.loop %}loop{% endif %}
    {% if include.muted %}muted{% endif %}></audio>
  {% if include.caption %}<figcaption class="caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
