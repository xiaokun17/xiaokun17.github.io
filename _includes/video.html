{% assign extension = include.path | split: '?' | first | split: '#' | first | split: '.' | last | downcase %}
{% assign formats = 'mp4,webm,ogg,ogv' | split: ',' %}
<figure>
  {% capture dimensions %}
    {% if include.width %}width="{{ include.width | escape }}"{% endif %}
    {% if include.height %}height="{{ include.height | escape }}"{% endif %}
    style="max-width: {{ include.max-width | default: '100%' | escape }};{% if include.min-width %} min-width: {{ include.min-width | escape }};{% endif %}{% if include.max-height %} max-height: {{ include.max-height | escape }};{% endif %}{% if include.min-height %} min-height: {{ include.min-height | escape }};{% endif %}"
  {% endcapture %}
  {% if formats contains extension %}
    <video src="{{ include.path | relative_url | escape }}" {{ dimensions }}
      {% if include.class %}class="{{ include.class | escape }}"{% endif %}
      {% if include.title or include.alt %}aria-label="{{ include.title | default: include.alt | escape }}"{% endif %}
      {% if include.poster %}poster="{{ include.poster | relative_url | escape }}"{% endif %}
      {% if include.autoplay %}autoplay{% endif %}
      {% if include.controls %}controls{% endif %}
      {% if include.loop %}loop{% endif %}
      {% if include.muted %}muted{% endif %} playsinline></video>
  {% else %}
    <iframe src="{{ include.path | relative_url | escape }}" {{ dimensions }}
      {% if include.class %}class="{{ include.class | escape }}"{% endif %}
      title="{{ include.title | default: include.alt | default: 'Embedded video' | escape }}"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>
  {% endif %}
  {% if include.caption %}<figcaption class="caption">{{ include.caption }}</figcaption>{% endif %}
</figure>
